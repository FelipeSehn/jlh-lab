<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <title>JLH Lab (v0.1) — Justice League Heroes Technical Lab</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f1115; color: #e6edf3; padding: 20px; max-width: 540px; margin: auto; }
    h2 { border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #58a6ff; }
    .version-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; background: rgba(255, 193, 7, 0.14); color: #ffd54f; border: 1px solid rgba(255, 193, 7, 0.35); margin-bottom: 10px; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #8b949e; }
    select, input, button { width: 100%; padding: 10px; margin-top: 5px; font-size: 16px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #fff; box-sizing: border-box; }
    button { background: #238636; border: none; font-weight: bold; cursor: pointer; margin-top: 18px; }
    button:hover { background: #2ea043; }
    .card { background: #161b22; padding: 16px; border-radius: 8px; margin-top: 18px; border-left: 4px solid #58a6ff; }
    .alerta { color: #d29922; font-weight: bold; margin-top: 8px; }
    .erro { color: #f85149; font-weight: bold; }
    .tag { display: inline-block; background: #21262d; padding: 3px 8px; border-radius: 4px; font-size: 12px; color: #79c0ff; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h2>⚡ JLH Lab — Build Engineering</h2>
  <div class="version-badge">v0.1 — Early Access / Work in Progress</div>

  <label>Hero & Ability (Database):</label>
  <select id="skillSelect" onchange="calcular()"></select>

  <label>Damage Boosts (0 to 5):</label>
  <input type="number" id="dmg" value="0" min="0" max="5" oninput="calcular()">

  <label>Luck Boosts (0 to 5):</label>
  <input type="number" id="luck" value="0" min="0" max="5" oninput="calcular()">

  <label>Speed Boosts (0 to 5):</label>
  <input type="number" id="speed" value="0" min="0" max="5" oninput="calcular()">

  <label>Duration Boosts (0 to 5):</label>
  <input type="number" id="duration" value="0" min="0" max="5" oninput="calcular()">

  <label>Range Boosts (0 to 5):</label>
  <input type="number" id="range" value="0" min="0" max="5" oninput="calcular()">

  <label>Efficiency Boosts (0 to 5):</label>
  <input type="number" id="efficiency" value="0" min="0" max="5" oninput="calcular()">
 
  <button onclick="calcular()">Recalculate Simulation</button>

  <div class="card" id="resultado"></div>

  <script>
  // =========================================================================
    // 1. Game DATABASE (Add new tested skills here!)
    // =========================================================================
    const BANCO_DE_SKILLS = {
      ww_flying: {
        heroi: "Wonder Woman",
        nome: "Flying Charge (Investida Giratória)",
        pisoDano: 223,
        ganhoPorDamage: 85,
        canCrit: true,
        multCritico: 2.95,
        speedCapAlerta: 3,
        notaFixa: "Validated optimal build: 1 Damage + 2 Luck + 2 Speed (308 / 895 at 140%)"
      },
      ww_ricochet: {
        heroi: "Wonder Woman",
        nome: "Ricochet (Tiara)",
        pisoDano: 1100,
        ganhoPorDamage: 302,
        canCrit: false,
        multCritico: 1,
        speedCapAlerta: 99,
        notaFixa: "Flag CanCrit = FALSE. Focus 100% on Damage (2610 flat with 5 boosts)."
      },
      ww_lasso: {
        heroi: "Wonder Woman",
        nome: "Lasso Capture",
        pisoDano: 0,
        ganhoPorDamage: 0,
        canCrit: true,
        multCritico: 0,
        speedCapAlerta: 99,
        energiaBase: 253,
        duracaoBase: 4.0,
        ganhoPorDuration: 3.2, // <--- o ganho exato por boost de Duration nível 7!
        raioBase: 12.0,
        ganhoPorRange: 7.4, // <--- 0 ganho exato por boost de range nível 7!
        maxInimigos: 5,
        notaFixa: "Crowd control skill. Range and Duration boosts looks better here!"
      }
    };

    // =========================================================================
    // 2. CALCULATION ENGINE (Reads the database above and renders UI)
    // =========================================================================
    const select = document.getElementById("skillSelect");
    for (const [id, dados] of Object.entries(BANCO_DE_SKILLS)) {
      const opcao = document.createElement("option");
      opcao.value = id;
      opcao.textContent = `${dados.heroi} — ${dados.nome}`;
      select.appendChild(opcao);
    }

    function calcular() {
      const skill = BANCO_DE_SKILLS[select.value];
      const dmg = Number(document.getElementById("dmg").value);
      const luck = Number(document.getElementById("luck").value);
      const speed = Number(document.getElementById("speed").value);
      const duration = Number(document.getElementById("duration").value);
      const range = Number(document.getElementById("range").value);
      const efficiency = Number(document.getElementById("efficiency").value);
      const caixa = document.getElementById("resultado");

      const totalBoosts = dmg + luck + speed + duration + range + efficiency;

      if (totalBoosts > 5) {
        caixa.innerHTML = `<p class='erro'>❌ Limit exceeded (${totalBoosts}/5): You can only equip 5 boosts in total!</p>`;
        return;
      }

      let alertas = "";
      let corpoHTML = "";

      if (skill.pisoDano > 0) {
        const danoNormal = Math.round(skill.pisoDano + (dmg * skill.ganhoPorDamage));
        const danoCritico = (skill.canCrit && luck > 0) ? Math.round(danoNormal * skill.multCritico) : 0;
        const attackSpeed = 100 + (speed * 20);

        if (!skill.canCrit && luck > 0) {
          alertas += "<p class='alerta'>⚠️ Wasted Slot: This skill cannot crit (CanCrit = False).</p>";
        }
        if (skill.canCrit && luck === 0) {
          alertas += "<p class='alerta'>⚠️ Crit Disabled: 0 luck boosts = 0% crit chance.</p>";
        }
        if (speed >= skill.speedCapAlerta) {
          alertas += "<p class='alerta'>⚠️ Hitbox Warning: 160%+ speed can pass through targets without registering hits.</p>";
        }

        corpoHTML = `
          <p><strong>Normal Damage:</strong> ${danoNormal}</p>
          <p><strong>Critical Damage:</strong> ${danoCritico > 0 ? danoCritico : "N/A"}</p>
          <p><strong>Attack Speed:</strong> ${attackSpeed}%</p>
        `;
      } else {
        const raioFinal = skill.raioBase + (range * (skill.ganhoPorRange || 0));
        const duracaoFinal = skill.duracaoBase + (duration * (skill.ganhoPorDuration || 0)); // <--- Ponto e vírgula adicionado aqui!

        corpoHTML = `
          <p><strong>Energy Cost:</strong> ${skill.energiaBase}</p>
          <p><strong>Duration:</strong> ${duracaoFinal.toFixed(1)}s (${duration} Duration boost${duration !== 1 ? 's' : ''})</p> <-- fixed here
          <p><strong>Capture Radius:</strong> ${raioFinal.toFixed(1)} ft (${range} Range boost${range !== 1 ? 's' : ''})</p>
          <p><strong>Max Targets:</strong> ${skill.maxInimigos}</p>
        `;
      }

      caixa.innerHTML = `
        <span class="tag">${skill.heroi} — ${totalBoosts}/5 Boosts</span>
        ${corpoHTML}
        <p><strong>Utility Boosts:</strong> +${duration} Duration / +${range} Range / +${efficiency} Efficiency</p>
        <p style="color:#8b949e; font-size:13px;">📌 ${skill.notaFixa}</p>
        ${alertas}
      `;
    }

    calcular(); // run initial calculation on page load
  </script>

</body>
</html>
