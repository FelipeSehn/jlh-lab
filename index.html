<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <title>JLH Lab (v0.1) — Justice League Heroes Technical Lab</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f1115; color: #e6edf3; padding: 20px; max-width: 540px; margin: auto; }
    h2 { border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #58a6ff; }
    .version-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; background: rgba(255, 193, 7, 0.14); color: #ffd54f; border: 1px solid rgba(255, 193, 7, 0.35); margin-bottom: 10px; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #8b949e; }
    select, input, button { width: 100%; padding: 10px; margin-top: 5px; font-size: 16px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #fff; box-sizing: border-box; }
    button { background: #238636; border: none; font-weight: bold; cursor: pointer; margin-top: 18px; }
    button:hover { background: #2ea043; }
    .card { background: #161b22; padding: 16px; border-radius: 8px; margin-top: 18px; border-left: 4px solid #58a6ff; }
    .alerta { color: #d29922; font-weight: bold; margin-top: 8px; }
    .erro { color: #f85149; font-weight: bold; }
    .tag { display: inline-block; background: #21262d; padding: 3px 8px; border-radius: 4px; font-size: 12px; color: #79c0ff; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h2>⚡ JLH Lab — Build Engineering</h2>
  <div class="version-badge">v0.1 — Early Access / Work in Progress</div>

  <label>Hero & Ability (Database):</label>
  <select id="skillSelect"></select>

  <label>Damage Boosts (0 to 5):</label>
  <input type="number" id="dmg" value="0" min="0" max="5">

  <label>Luck Boosts (0 to 5):</label>
  <input type="number" id="luck" value="0" min="0" max="5">

  <label>Speed Boosts (0 to 5):</label>
  <input type="number" id="speed" value="0" min="0" max="5">

  <label>Duration Boosts (0 to 5):</label>
  <input type="number" id="duration" value="0" min="0" max="5">

  <label>Range Boosts (0 to 5):</label>
  <input type="number" id="range" value="0" min="0" max="5">

  <label>Efficiency Boosts (0 to 5):</label>
  <input type="number" id="efficiency" value="0" min="0" max="5">
 
  <button id="btnRecalcular">Recalculate Simulation</button>

  <div class="card" id="resultado"></div>

  <script>
    const BANCO_DE_SKILLS = {
      ww_flying: {
        heroi: "Wonder Woman",
        nome: "Flying Charge",
        descricao: "Wonder Woman charges forward damaging all enemies in her path.",
        pisoDano: 1363,
        ganhoPorDamage: 409,
        canCrit: true,
        multCritico: 2.0, // multiplicador padrão de crítico
        speedCapAlerta: 3,
        notasFixas: ["Base damage: 1363/sec (+409 per Damage boost, max 3407/sec).",
          "⚡ Speed Scaling: +20% attack speed per boost (Base 100% -> 200% max). Watch out for hitbox pass-through at 160%+!",
          "🍀Luck Scaling: Fully functional! Adds 8% crit chance per boost (Base 0% -> 14% max).",
          "⏱️ Duration Scaling: Adds +2.4s to Stun Duration per boost (Base 2.0s -> 14.0s max).",
          "🎯 Range Scaling: Reduces Energy Cost (-56/boost, base 377 -> 94 max).",
          "🔋 Efficiency Curve: Drops cost to 63 at 3-5 boosts (Curve: 377 -> 226 -> 75 -> 63 -> 63 -> 63)."
        ]
      },
      ww_ricochet: {
        heroi: "Wonder Woman",
        nome: "Ricochet",
        descricao: "Wonder Woman throws her magic tiara like a boomerang, hitting one or more targets before returning to her.",
        pisoDano: 1044,
        ganhoPorDamage: 313,
        ganhoPorSpeedDano: 83.5,
        canCrit: false,
        multCritico: 1,
        speedCapAlerta: 99,
        notasFixas: [
          "Base normal damage: 1044. Scales precisely +313 per Damage boost (Max: 2610).",
          "⚡ Speed Scaling: Speed boosts increase damage (+83.5/boost, max 1462).",
          "⏱️ Duration Scaling: Adds +2.4s to Stun Duration per boost (Base 2.0s -> 14.0s max).",
          "🎯 Range Scaling: Reduces Energy Cost (-52/boost, base 348 -> 87 max).",
          "🔋 Efficiency Curve: Drops cost (348 -> 209 -> 70 -> 58 -> 58).",
          "⚠️ TRAP WARNING: Luck boosts falsely inflate the simulated crit chance up to 40.0% (8% per boost), but the engine hard-caps actual critical output at 0%. Do not waste slots on Luck!"
        ]
      },
      ww_lasso: {
        heroi: "Wonder Woman",
        nome: "Lasso Capture",
        descricao: "Wonder Woman binds her foe using the Magic Lariat, holding him for a time. Level-up this skill to capture multiple enemies at once, pulling them together in a group.",
        pisoDano: 0,
        ganhoPorDamage: 0,
        canCrit: true,
        multCritico: 0,
        speedCapAlerta: 99,
        energiaBase: 253,
        reducaoEnergiaPorDamage: 38,
        duracaoBase: 4.0,
        ganhoPorDuration: 3.2,
        ganhoPorSpeedDuration: 1.8,
        ganhoPorLuckDuration: 1.8,
        raioBase: 12.0,
        ganhoPorRange: 7.4,
        maxInimigos: 5,
        notasFixas: [
          "Crowd control skill. Range and Duration boosts look great here!",
          "Tested with Level 7 Damage Boosts: Reduces Energy Cost linearly by 38 per boost (253 down to 63).",
          "Tested with level 7 Speed & Luck Boosts: Both secretly scale duration (1.8s per boost)!",
          "Tested with level 7 Efficiency Boosts: Drips Energy cost down rapidly (1->152, 2->51, 3->42, 4->42, 5->42)."
        ]
      }
    };

    const select = document.getElementById("skillSelect");
    for (const [id, dados] of Object.entries(BANCO_DE_SKILLS)) {
      const opcao = document.createElement("option");
      opcao.value = id;
      opcao.textContent = `${dados.heroi} — ${dados.nome}`;
      select.appendChild(opcao);
    }

    function calcular() {
      const skillId = select.value;
      const skill = BANCO_DE_SKILLS[skillId];
      
      const dmg = Number(document.getElementById("dmg").value) || 0;
      const luck = Number(document.getElementById("luck").value) || 0;
      const speed = Number(document.getElementById("speed").value) || 0;
      const duration = Number(document.getElementById("duration").value) || 0;
      const range = Number(document.getElementById("range").value) || 0;
      const efficiency = Number(document.getElementById("efficiency").value) || 0;
      const caixa = document.getElementById("resultado");

      const totalBoosts = dmg + luck + speed + duration + range + efficiency;

      if (totalBoosts > 5) {
        caixa.innerHTML = `<p class='erro'>❌ Limit exceeded (${totalBoosts}/5): You can only equip 5 boosts in total!</p>`;
        return;
      }

     let alertas = "";
      let corpoHTML = "";

      if (skill.pisoDano > 0) {
        let danoNormal = Math.round(skill.pisoDano + (dmg * skill.ganhoPorDamage));
        let energiaRicochet = 348;
        let stunDurationFinal = 2.0;

        // Regras exclusivas descobertas para o Ricochet
        if (skillId === "ww_ricochet") {
          // Speed scale damage
          if (speed > 0) {
            danoNormal += Math.round(speed * skill.ganhoPorSpeedDano);
          }
          // Duration scale stun duration (+2.4s per boost)
          stunDurationFinal = 2.0 + (duration * 2.4);

          // Range scale energy cost (348 down to 87, step ~52)
          if (range > 0) {
            const tabelaRangeEnergy = [348, 296, 244, 191, 139, 87];
            energiaRicochet = tabelaRangeEnergy[range] !== undefined ? tabelaRangeEnergy[range] : 87;
          }
          // Efficiency scale energy cost
          else if (efficiency > 0) {
            const tabelaEffEnergy = [348, 348, 209, 70, 58, 58];
            energiaRicochet = tabelaEffEnergy[efficiency] !== undefined ? tabelaEffEnergy[efficiency] : 58;
          }
        }

        // Armadilha do Luck
        let fakeCritChance = 0;
        if (skillId === "ww_ricochet") {
          fakeCritChance = luck * 8.0; 
          if (luck > 0) {
            alertas += `<p class='erro'>⚠️ LUCK TRAP TRIGGERED: Simulated Crit is ${fakeCritChance.toFixed(1)}%, but actual engine output remains 0.0% (Wasted Stat)!</p>`;
          }
        }

        const danoCritico = (skill.canCrit && luck > 0) ? Math.round(danoNormal * skill.multCritico) : 0;

        if (!skill.canCrit && skillId !== "ww_ricochet" && luck > 0) {
          alertas += "<p class='alerta'>⚠️ Wasted Slot: This skill cannot crit (CanCrit = False).</p>";
        }

        // Montagem do HTML de saída para skills de dano
        if (skillId === "ww_ricochet") {
          corpoHTML = `
            <p><strong>Normal Damage:</strong> ${danoNormal} ${dmg > 0 ? `(+${dmg} Dmg)` : ''} ${speed > 0 ? `(+${speed} Spd Dmg)` : ''}</p>
            <p><strong>Energy Cost:</strong> ${energiaRicochet} ${range > 0 ? `(Range Boosted)` : ''} ${efficiency > 0 ? `(Efficiency Boosted)` : ''}</p>
            <p><strong>Stun Duration:</strong> ${stunDurationFinal.toFixed(1)}s ${duration > 0 ? `(+${duration} Duration)` : ''}</p>
            <p><strong>Chance of Critical Hit:</strong> ${fakeCritChance.toFixed(1)}% <span style="color:#f85149;">(Fake/No Effect)</span></p>
            <p><strong>Chance of Stun:</strong> 19.0% | <strong>Disarm:</strong> 45.0%</p>
          `;
        } else {
          const attackSpeed = 100 + (speed * 20);
          corpoHTML = `
            <p><strong>Normal Damage:</strong> ${danoNormal}</p>
            <p><strong>Critical Damage:</strong> ${danoCritico > 0 ? danoCritico : "N/A"}</p>
            <p><strong>Attack Speed:</strong> ${attackSpeed}%</p>
          `;
        }
      } else {
        // Bloco do Lasso Capture (mantém o que já estava)
      
        const raioFinal = skill.raioBase + (range * (skill.ganhoPorRange || 0));
        
        const ganhoDuracaoTotal = (duration * (skill.ganhoPorDuration || 0)) + 
                                  (speed * (skill.ganhoPorSpeedDuration || 0)) + 
                                  (luck * (skill.ganhoPorLuckDuration || 0));
        const duracaoFinal = skill.duracaoBase + ganhoDuracaoTotal;
        
        let energiaCalculada = skill.energiaBase || 0;

        if (efficiency > 0 && skillId === "ww_lasso") {
          const tabelaEficiencia = [253, 152, 51, 42, 42, 42];
          energiaCalculada = tabelaEficiencia[efficiency] !== undefined ? tabelaEficiencia[efficiency] : 42;
        } else if (dmg > 0 && skill.reducaoEnergiaPorDamage) {
          energiaCalculada -= (dmg * skill.reducaoEnergiaPorDamage);
        }

       if (skill.pisoDano > 0 && skillId === "ww_flying") {
        const danoNormal = Math.round(skill.pisoDano + (dmg * skill.ganhoPorDamage));
        const attackSpeed = 100 + (speed * 20);
        const stunDurationFinal = 2.0 + (duration * 2.4);
        const critChance = luck * 8.0; // 0% a 40%
        const danoCritico = luck > 0 ? Math.round(danoNormal * 1.8) : 0; // Estimativa de dano crítico

        let energiaFlying = 377;
        if (range > 0) {
          const tabelaRangeFlying = [377, 320, 264, 207, 151, 94];
          energiaFlying = tabelaRangeFlying[range] !== undefined ? tabelaRangeFlying[range] : 94;
        } else if (efficiency > 0) {
          const tabelaEffFlying = [377, 226, 75, 63, 63, 63];
          energiaFlying = tabelaEffFlying[efficiency] !== undefined ? tabelaEffFlying[efficiency] : 63;
        }

        if (speed >= skill.speedCapAlerta) {
          alertas += "<p class='alerta'>⚠️ Hitbox Warning: 160%+ speed can pass through targets without registering hits.</p>";
        }

        corpoHTML = `
          <p><strong>Damage:</strong> ${danoNormal}/sec ${dmg > 0 ? `(+${dmg} Dmg)` : ''}</p>
          <p><strong>Energy Cost:</strong> ${energiaFlying} ${range > 0 ? `(Range Boosted)` : ''} ${efficiency > 0 ? `(Efficiency Boosted)` : ''}</p>
          <p><strong>Attack Speed:</strong> ${attackSpeed}%</p>
          <p><strong>Stun Duration:</strong> ${stunDurationFinal.toFixed(1)}s</p>
          <p><strong>Chance of Critical Hit:</strong> ${critChance.toFixed(1)}% ${danoCritico > 0 ? `(Est. Crit: ${danoCritico})` : ''}</p>
          <p><strong>Chance of Stun:</strong> 25.0%</p>
        `;
      }
      }

      const notasHTML = Array.isArray(skill.notasFixas) 
        ? skill.notasFixas.map(n => `📌 ${n}`).join('<br>') 
        : `📌 ${skill.notaFixa || ''}`;

      caixa.innerHTML = `
        <span class="tag">${skill.heroi} — ${totalBoosts}/5 Boosts</span>
        <h3 style="margin: 8px 0; color: #58a6ff; font-size: 16px;">${skill.nome}</h3>
        ${skill.descricao ? `<p style="color: #8b949e; font-style: italic; font-size: 13px; margin-bottom: 12px;">"${skill.descricao}"</p>` : ''}
        ${corpoHTML}
        <p><strong>Active Boosts:</strong> +${dmg} Damage / +${luck} Luck / +${speed} Speed / +${duration} Duration / +${range} Range / +${efficiency} Efficiency</p>
        <p style="color:#8b949e; font-size:13px; margin-top:10px;">${notasHTML}</p>
        ${alertas}
      `;
    }

    document.getElementById("skillSelect").addEventListener("change", calcular);
    document.getElementById("dmg").addEventListener("input", calcular);
    document.getElementById("luck").addEventListener("input", calcular);
    document.getElementById("speed").addEventListener("input", calcular);
    document.getElementById("duration").addEventListener("input", calcular);
    document.getElementById("range").addEventListener("input", calcular);
    document.getElementById("efficiency").addEventListener("input", calcular);
    document.getElementById("btnRecalcular").addEventListener("click", calcular);

    calcular();
  </script>

</body>
</html>
