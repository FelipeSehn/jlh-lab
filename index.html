<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <title>JLH Lab (v0.2) — Justice League Heroes Technical Lab</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f1115; color: #e6edf3; padding: 20px; max-width: 540px; margin: auto; }
    h2 { border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #58a6ff; }
    .version-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; background: rgba(88, 166, 255, 0.14); color: #58a6ff; border: 1px solid rgba(88, 166, 255, 0.35); margin-bottom: 10px; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #8b949e; }
    select, input, button { width: 100%; padding: 10px; margin-top: 5px; font-size: 16px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #fff; box-sizing: border-box; }
    button { background: #238636; border: none; font-weight: bold; cursor: pointer; margin-top: 18px; }
    button:hover { background: #2ea043; }
    .card { background: #161b22; padding: 16px; border-radius: 8px; margin-top: 18px; border-left: 4px solid #58a6ff; }
    .alerta { color: #d29922; font-weight: bold; margin-top: 8px; }
    .erro { color: #f85149; font-weight: bold; }
    .tag { display: inline-block; background: #21262d; padding: 3px 8px; border-radius: 4px; font-size: 12px; color: #79c0ff; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h2>⚡ JLH Lab — Build Engineering</h2>
  <div class="version-badge">v0.2 — Database Core Integrated</div>

  <label>Hero & Ability (Database):</label>
  <select id="skillSelect"></select>

  <label>Damage Boosts (0 to 5):</label>
  <input type="number" id="dmg" value="0" min="0" max="5">

  <label>Luck Boosts (0 to 5):</label>
  <input type="number" id="luck" value="0" min="0" max="5">

  <label>Speed Boosts (0 to 5):</label>
  <input type="number" id="speed" value="0" min="0" max="5">

  <label>Duration Boosts (0 to 5):</label>
  <input type="number" id="duration" value="0" min="0" max="5">

  <label>Range Boosts (0 to 5):</label>
  <input type="number" id="range" value="0" min="0" max="5">

  <label>Efficiency Boosts (0 to 5):</label>
  <input type="number" id="efficiency" value="0" min="0" max="5">
 
  <button id="btnRecalcular">Recalculate Simulation</button>

  <div class="card" id="resultado"></div>

  <script>
    const BANCO_DE_HEROIS = {
      "Wonder Woman": { vida: "5445 / 5445", energia: "2251 / 2251", nivel: 20 }
    };

    const BANCO_DE_SKILLS = {
      ww_combat: {
        heroi: "Wonder Woman",
        nome: "Combat (Basic Attacks & Combos)",
        descricao: "Overall ability to deal damage with standard attacks and combos.",
        isCombat: true,
        tabelas: {
          damageQuick: [478, 511, 545, 578, 612, 645],
          damageStrong: [956, 1022, 1089, 1156, 1223, 1290],
          speed: [100.0, 107.0, 114.0, 121.0, 128.0, 135.0],
          luck: [10.0, 13.5, 17.0, 20.5, 24.0, 27.5],
          duration: [2.0, 3.7, 5.4, 7.1, 8.8, 10.5],
          secondaryBuff: [478, 494, 511, 528, 545, 561]
        },
        notasFixas: [
          "Base Quick Attack: 478 -> Max 645. Strong Attack: 956 -> Max 1290.",
          "⚔️ Speed Scaling: Boosts attack speed up to 135%.",
          "🍀 Luck Scaling: Scales base critical hit chance from 10% up to 27.5%.",
          "⏱️ Duration Scaling: Massively increases stun duration up to 10.5 seconds."
        ]
      },
      ww_flying: {
        heroi: "Wonder Woman",
        nome: "Flying Charge",
        descricao: "Wonder Woman charges forward damaging all enemies in her path.",
        pisoDano: 1363,
        canCrit: true,
        multCritico: 1.8,
        speedCapAlerta: 3,
        tabelas: {
          damage: [1363, 1772, 2181, 2590, 2999, 3407],
          speed: [100, 120, 140, 160, 180, 200],
          luck: [0.0, 8.0, 16.0, 24.0, 32.0, 40.0],
          duration: [2.0, 4.4, 6.8, 9.2, 11.6, 14.0],
          rangeEnergy: [377, 320, 264, 207, 151, 94],
          effEnergy: [377, 226, 75, 63, 63, 63]
        },
        notasFixas: [
          "Base damage: 1363/sec (+409 per Damage boost, max 3407/sec).",
          "⚡ Speed Scaling: +20% attack speed per boost (Base 100% -> 200% max).",
          "🍀 Luck Scaling: Fully functional! Adds +8% crit chance per boost (Base 0% -> 40% max).",
          "⏱️ Duration Scaling: Adds +2.4s to Stun Duration per boost (Base 2.0s -> 14.0s max).",
          "🎯 Range Scaling: Reduces Energy Cost (-56/boost, base 377 -> 94 max).",
          "🔋 Efficiency Curve: Drops cost to 63 at 3-5 boosts."
        ]
      },
      ww_ricochet: {
        heroi: "Wonder Woman",
        nome: "Ricochet",
        descricao: "Wonder Woman throws her magic tiara like a boomerang, hitting one or more targets before returning to her.",
        pisoDano: 1044,
        canCrit: true,
        multCritico: 3.0,
        speedCapAlerta: 99,
        tabelas: {
          damage: [1044, 1357, 1670, 1984, 2297, 2610],
          speedDano: [1044, 1128, 1211, 1295, 1378, 1462],
          duration: [2.0, 4.4, 6.8, 9.2, 11.6, 14.0],
          rangeEnergy: [348, 296, 244, 191, 139, 87],
          effEnergy: [348, 348, 209, 70, 58, 58],
          luck: [0.0, 8.0, 16.0, 24.0, 32.0, 40.0]
        },
        notasFixas: [
          "Base normal damage: 1044 (+313 per Damage boost, max 2610).",
          "⚡ Speed Scaling: Speed boosts increase damage up to 1462.",
          "🍀 Luck Scaling: Fully functional! Adds +8% crit chance per boost (max 40%) with a massive 3.0x Crit Multiplier!",
          "⏱️ Duration Scaling: Adds +2.4s to Stun Duration per boost (max 14.0s).",
          "🎯 Range Scaling: Reduces Energy Cost (-52/boost, base 348 -> 87 max).",
          "🔋 Efficiency Curve: Drops cost (348 -> 209 -> 70 -> 58 -> 58).",
          "🛡️ Chance to Disarm: Fixed at 45.0% | Chance of Stun: 19.0%."
        ]
      },
      ww_spin: {
        heroi: "Wonder Woman",
        nome: "Lasso Spin",
        descricao: "Using the magic lasso, Wonder Woman captures a foe and swings him around, turning him into an effective weapon against his comrades.",
        pisoDano: 877,
        canCrit: true,
        multCritico: 1.8,
        speedCapAlerta: 99,
        tabelas: {
          damage: [877, 1141, 1404, 1667, 1930, 2194],
          speed: [180, 216, 252, 288, 324, 360],
          luck: [0.0, 8.0, 16.0, 24.0, 32.0, 40.0],
          range: [24.0, 30.7, 37.4, 44.2, 50.9, 57.6],
          durationEnergy: [117, 84, 51, 20, 20, 20],
          effEnergy: [117, 70, 23, 20, 20, 20]
        },
        notasFixas: [
          "Base impact damage: 877 (+263 per Damage boost, max 2194).",
          "🌪️ Speed Scaling: Increases Spin Rate (+36% per boost, max 360%).",
          "🍀 Luck Scaling: Fully functional! Adds +8% crit chance per boost (max 40%).",
          "🎯 Range Scaling: Increases Capture Range (+6.72 ft per boost, max 57.6 ft).",
          "🔋 Efficiency & Duration Curves: Both drop energy cost down to an ultra-cheap floor of 20."
        ]
      },
      ww_snare: {
        heroi: "Wonder Woman",
        nome: "Lasso Snare",
        descricao: "Using her magic lariat, Wonder Woman captures her foe and reels him in for an effective melee attack.",
        pisoDano: 1421,
        canCrit: true,
        multCritico: 1.8,
        speedCapAlerta: 99,
        tabelas: {
          damage: [1421, 1847, 2274, 2700, 3126, 3552],
          speedImpact: [400, 680, 960, 1240, 1520, 1800],
          luck: [0.0, 8.0, 16.0, 24.0, 32.0, 40.0],
          stunChance: [5.0, 30.0, 55.0, 80.0, 105.0, 130.0],
          range: [29.0, 37.1, 45.2, 53.4, 61.5, 69.6],
          effEnergy: [261, 157, 52, 44, 44, 44]
        },
        notasFixas: [
          "Base damage: 1421 (+426.2 per Damage boost, max 3552).",
          "⚡ Speed Scaling: Massively scales Impact Force (+280% per boost, max 1800%).",
          "🍀 Luck Scaling: Fully functional! Adds +8% crit chance per boost (max 40%).",
          "⏱️ Duration/Stun Scaling: Adds +25% Stun Duration/Chance per boost (max 130%).",
          "🎯 Range Scaling: Extends Snare Distance (+8.12 ft per boost, max 69.6 ft).",
          "🔋 Efficiency Curve: Drops energy cost down to a floor of 44."
        ]
      },
      ww_lasso: {
        heroi: "Wonder Woman",
        nome: "Lasso Capture",
        descricao: "Wonder Woman binds her foe using the Magic Lariat, holding him for a time. Level-up this skill to capture multiple enemies at once.",
        pisoDano: 0,
        canCrit: false,
        maxInimigos: 5,
        tabelas: {
          range: [12.0, 19.4, 26.8, 34.2, 41.6, 49.0], // Capture Radius ft
          duration: [4.0, 7.2, 10.4, 13.6, 16.8, 20.0], // Duration sec
          luckDuration: [4.0, 5.8, 7.5, 9.3, 11.0, 12.8], // Luck duration scaling
          dmgEnergy: [253, 215, 177, 139, 101, 63], // Energy Cost com Damage
          effEnergy: [253, 152, 51, 42, 42, 42] // Energy Cost com Efficiency
        },
        notasFixas: [
          "Crowd control skill (Max 5 targets). Range boosts expand radius up to 49 ft.",
          "⏱️ Duration Boosts: Massively scales capture duration from 4.0s up to 20.0s.",
          "🍀 Luck Boosts: Also scales capture duration up to 12.8s.",
          "🔋 Energy Cost: Both Damage boosts (down to 63) and Efficiency boosts (down to 42) aggressively lower energy consumption!"
        ]
      }
    };

    const select = document.getElementById("skillSelect");
    for (const [id, dados] of Object.entries(BANCO_DE_SKILLS)) {
      const opcao = document.createElement("option");
      opcao.value = id;
      opcao.textContent = `${dados.heroi} — ${dados.nome}`;
      select.appendChild(opcao);
    }

    function calcular() {
      const skillId = select.value;
      const skill = BANCO_DE_SKILLS[skillId];
      const dadosHeroi = BANCO_DE_HEROIS[skill.heroi];
      
      const dmg = Number(document.getElementById("dmg").value) || 0;
      const luck = Number(document.getElementById("luck").value) || 0;
      const speed = Number(document.getElementById("speed").value) || 0;
      const duration = Number(document.getElementById("duration").value) || 0;
      const range = Number(document.getElementById("range").value) || 0;
      const efficiency = Number(document.getElementById("efficiency").value) || 0;
      const caixa = document.getElementById("resultado");

      const totalBoosts = dmg + luck + speed + duration + range + efficiency;

      if (totalBoosts > 5) {
        caixa.innerHTML = `<p class='erro'>❌ Limit exceeded (${totalBoosts}/5): You can only equip 5 boosts in total!</p>`;
        return;
      }

      let corpoHTML = "";

      if (skill.isCombat) {
        let quickDmg = skill.tabelas.damageQuick[dmg];
        let strongDmg = skill.tabelas.damageStrong[dmg];
        if (range > 0) {
          quickDmg = skill.tabelas.secondaryBuff[range];
          strongDmg = Math.round(quickDmg * 2);
        } else if (efficiency > 0) {
          quickDmg = skill.tabelas.secondaryBuff[efficiency];
          strongDmg = Math.round(quickDmg * 2);
        }

        corpoHTML = `
          <p><strong>Quick Attack Damage:</strong> ${quickDmg}</p>
          <p><strong>Strong Attack Damage:</strong> ${strongDmg}</p>
          <p><strong>Attack Speed:</strong> ${skill.tabelas.speed[speed]}%</p>
          <p><strong>Critical Hit Chance:</strong> ${skill.tabelas.luck[luck]}%</p>
          <p><strong>Stun Duration:</strong> ${skill.tabelas.duration[duration]}s</p>
        `;
      } else if (skillId === "ww_lasso") {
        let raioFinal = skill.tabelas.range[range];
        let duracaoFinal = skill.tabelas.duration[duration];
        if (luck > 0 && duration === 0) {
          duracaoFinal = skill.tabelas.luckDuration[luck];
        }
        let energiaLasso = 253; // Base padrão
        if (efficiency > 0) {
          energiaLasso = skill.tabelas.effEnergy[efficiency];
        } else if (dmg > 0) {
          energiaLasso = skill.tabelas.dmgEnergy[dmg];
        }

        corpoHTML = `
          <p><strong>Energy Cost:</strong> ${energiaLasso} ${efficiency > 0 ? '(Efficiency Boosted)' : (dmg > 0 ? '(Damage Boosted)' : '')}</p>
          <p><strong>Capture Radius:</strong> ${raioFinal} ft</p>
          <p><strong>Capture Duration:</strong> ${duracaoFinal}s</p>
          <p><strong>Max Targets:</strong> ${skill.maxInimigos}</p>
        `;
      } else if (skill.pisoDano > 0) {
        let danoNormal = skill.tabelas.damage[dmg] || skill.pisoDano;
        let energiaCalculada = 377;

        if (skillId === "ww_flying") {
          energiaCalculada = range > 0 ? skill.tabelas.rangeEnergy[range] : (efficiency > 0 ? skill.tabelas.effEnergy[efficiency] : 377);
        } else if (skillId === "ww_ricochet") {
          if (speed > 0) danoNormal = skill.tabelas.speedDano[speed];
          energiaCalculada = range > 0 ? skill.tabelas.rangeEnergy[range] : (efficiency > 0 ? skill.tabelas.effEnergy[efficiency] : 348);
        } else if (skillId === "ww_spin") {
          energiaCalculada = duration > 0 ? skill.tabelas.durationEnergy[duration] : (efficiency > 0 ? skill.tabelas.effEnergy[efficiency] : 117);
        } else if (skillId === "ww_snare") {
          energiaCalculada = efficiency > 0 ? skill.tabelas.effEnergy[efficiency] : 261;
        }

        const critChanceVal = skill.tabelas.luck ? skill.tabelas.luck[luck] : 0;
        const speedVal = skillId === "ww_flying" ? skill.tabelas.speed[speed] : (skillId === "ww_spin" ? skill.tabelas.speed[speed] : (skillId === "ww_snare" ? skill.tabelas.speedImpact[speed] : 100));
        const rangeVal = skillId === "ww_spin" ? skill.tabelas.range[range] : (skillId === "ww_snare" ? skill.tabelas.range[range] : 24.0);
        const stunSecVal = skill.tabelas.duration ? skill.tabelas.duration[duration] : 2.0;
        const stunChanceVal = skillId === "ww_snare" ? skill.tabelas.stunChance[duration] : 19.0;
        const danoCritico = (skill.canCrit && luck > 0) ? Math.round(danoNormal * skill.multCritico) : 0;

        if (skillId === "ww_flying") {
          corpoHTML = `
            <p><strong>Damage:</strong> ${danoNormal}/sec</p>
            <p><strong>Energy Cost:</strong> ${energiaCalculada}</p>
            <p><strong>Attack Speed:</strong> ${speedVal}%</p>
            <p><strong>Chance of Stun:</strong> ${stunChanceVal}%</p>
            <p><strong>Duration of Stun:</strong> ${stunSecVal}s</p>
            <p><strong>Chance of Critical Hit:</strong> ${critChanceVal.toFixed(1)}% ${danoCritico > 0 ? `(Est. Crit: ${danoCritico})` : ''}</p>
          `;
        } else if (skillId === "ww_spin") {
          corpoHTML = `
            <p><strong>Impact Damage:</strong> ${danoNormal} ${dmg > 0 ? `(${dmg} Dmg)` : ''}</p>
            <p><strong>Energy Cost:</strong> ${energiaCalculada}</p>
            <p><strong>Spin Rate:</strong> ${speedVal}%</p>
            <p><strong>Capture Radius:</strong> ${rangeVal} ft</p>
            <p><strong>Chance of Critical Hit:</strong> ${critChanceVal.toFixed(1)}% ${danoCritico > 0 ? `(Est. Crit: ${danoCritico})` : ''}</p>
            <p><strong>Damage to Captive:</strong> 49/hit</p>
          `;
        } else if (skillId === "ww_ricochet") {
          corpoHTML = `
            <p><strong>Normal Damage:</strong> ${danoNormal} ${dmg > 0 ? `(${dmg} Dmg)` : ''} ${speed > 0 ? `(${speed} Spd Dmg)` : ''}</p>
            <p><strong>Energy Cost:</strong> ${energiaCalculada}</p>
            <p><strong>Stun Duration:</strong> ${stunSecVal}s</p>
            <p><strong>Chance of Stun:</strong> 19.0% | <strong>Chance to Disarm:</strong> 45.0%</p>
            <p><strong>Chance of Critical Hit:</strong> ${critChanceVal.toFixed(1)}% ${danoCritico > 0 ? `(Est. Crit: ${danoCritico} [3.0x Multiplier])` : ''}</p>
          `;
        } else if (skillId === "ww_snare") {
          corpoHTML = `
            <p><strong>Melee Damage:</strong> ${danoNormal} ${dmg > 0 ? `(${dmg} Dmg)` : ''}</p>
            <p><strong>Energy Cost:</strong> ${energiaCalculada}</p>
            <p><strong>Impact Force:</strong> ${speedVal}%</p>
            <p><strong>Snare Distance:</strong> ${rangeVal} ft</p>
            <p><strong>Chance of Stun:</strong> ${stunChanceVal}%</p>
            <p><strong>Chance of Critical Hit:</strong> ${critChanceVal.toFixed(1)}% ${danoCritico > 0 ? `(Est. Crit: ${danoCritico})` : ''}</p>
          `;
        }
      }

      const notasHTML = Array.isArray(skill.notasFixas) 
        ? skill.notasFixas.map(n => `📌 ${n}`).join('<br>') 
        : `📌 ${skill.notaFixa || ''}`;

      caixa.innerHTML = `
        <span class="tag">${skill.heroi} — Max HP: ${dadosHeroi.vida} | Max Energy: ${dadosHeroi.energia}</span>
        <h3 style="margin: 8px 0; color: #58a6ff; font-size: 16px;">${skill.nome}</h3>
        ${skill.descricao ? `<p style="color: #8b949e; font-style: italic; font-size: 13px; margin-bottom: 12px;">"${skill.descricao}"</p>` : ''}
        ${corpoHTML}
        <p><strong>Active Boosts:</strong> +${dmg} Dmg / +${luck} Luck / +${speed} Spd / +${duration} Dur / +${range} Rng / +${efficiency} Eff</p>
        <p style="color:#8b949e; font-size:13px; margin-top:10px;">${notasHTML}</p>
      `;
    }

    document.getElementById("skillSelect").addEventListener("change", calcular);
    document.getElementById("dmg").addEventListener("input", calcular);
    document.getElementById("luck").addEventListener("input", calcular);
    document.getElementById("speed").addEventListener("input", calcular);
    document.getElementById("duration").addEventListener("input", calcular);
    document.getElementById("range").addEventListener("input", calcular);
    document.getElementById("efficiency").addEventListener("input", calcular);
    document.getElementById("btnRecalcular").addEventListener("click", calcular);

    calcular();
  </script>

</body>
</html>
